name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes shellcheck jq

      - name: Syntax check
        run: bash -n install.sh get-quotas.sh scripts/package-release.sh tests/*.bash tests/helpers/*.sh

      - name: ShellCheck
        run: shellcheck install.sh get-quotas.sh scripts/package-release.sh tests/*.bash tests/helpers/*.sh

      - name: Tests
        run: bash tests/run.sh

      - name: Package release
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/quickshell-quotas-widget-$GITHUB_REF_NAME.tar.gz" --generate-notes
